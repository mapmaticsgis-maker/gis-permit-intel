name: Daily Permit Intel

on:
  # No `schedule:` trigger: GitHub deprioritizes cron-triggered runs on
  # lower-traffic repos -- observed a 2h25m delay on 2026-07-27 despite a
  # correctly configured 9:00 AM cron. Instead, trigger_github_workflow.py
  # fires this via workflow_dispatch (the API call below) from the
  # always-on PC's Task Scheduler at 9:00 AM CST, which has proven
  # reliable to the second for the 7:50 AM auto-download task.
  workflow_dispatch: {}      # also usable manually from the Actions tab

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas pyyaml requests pyshp openpyxl

      - name: Run daily pipeline
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: python run_daily_ci.py

      - name: Commit updated masters + outputs + run log
        if: always()
        run: |
          git config user.name "permit-intel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Daily permit intel run $(date -u +%F)"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/mapmaticsgis-maker/gis-permit-intel.git master
