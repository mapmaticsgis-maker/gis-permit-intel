# ============ PERMIT INTEL — CONFIG ============
data_dir: ./data            # master files + daily outputs live here
timezone: America/Chicago

# Master kill switch for every outbound email (daily brief, Enverus brief,
# failure alert, Intel Insight, Play Intel, and the local RRC reminder) --
# added 2026-09-23 while texas.rrc_ip_blocked leaves every brief with little
# or no real pull info to report, so a daily send isn't earning its keep.
# Flip to true to resume sending; nothing else about the pipeline (pulls,
# digests, master files, self-checks) is affected by this flag -- everything
# still runs and commits, it just stops emailing the result.
email_enabled: false

texas:
  # TXRRC confirmed by phone on 2026-09-17 that this connection's IP is
  # blocked as automated/bot traffic -- both the daf420 (MFT link below) and
  # the W-1 subscription portal (auto_download_subscriptions.py) sit behind
  # the same mft.rrc.texas.gov host, so both are affected. auto_download_rrc.py
  # and auto_download_subscriptions.py both check this flag first and no-op
  # rather than keep hammering an endpoint that already flagged this IP --
  # continuing to hit it while asking RRC to lift the block would undercut
  # that ask. Flip to false (and delete rrc_ip_blocked_since) once RRC confirms
  # the block is lifted; re-enabling the Task Scheduler tasks isn't needed,
  # since the scripts self-guard on this flag rather than on task State.
  rrc_ip_blocked: true
  rrc_ip_blocked_since: "2026-09-17"
  # Browser-based automated download: Playwright handles RRC's session/redirects
  fetch_url: "https://mft.rrc.texas.gov/link/5f07cc72-2e79-4df8-ade1-9aeb792e03fc"
  watch_dir: ./data/tx/inbox      # daf420.dat.MM-DD-YYYY files go here (auto-download + manual fallback)
  gdb: C:\GIS\RRC_Permits\RRC_Permits.gdb
  coord_cache: C:\GIS\RRC_Permits\rrc_coordinate_cache.csv
  build_gdb: true
  enverus_lookback_days: 21   # cross-check window -- wide enough to span an extended RRC outage;
                              # permits already in tx/master.csv drop out of the gap list on their own
  fields:
    id: "STATUS_NUMBER"
    api: "API_NO"
    operator: "OPERATOR_NAME"
    lease: "LEASE_NAME"
    well: "WELL_NUMBER"
    county: "COUNTY"
    district: "DISTRICT"
    issue_date: "ISSUE_DATE"
    submitted: "RECEIVED_DATE"
    depth: "TOTAL_DEPTH"
    wellbore: "WELLBORE_PROFILE"
    amend: "AMEND_FLAG"
    shl_lat: "SHL_LAT"
    shl_lon: "SHL_LONG"
    bhl_lat: "BHL_LAT"
    bhl_lon: "BHL_LONG"

louisiana:
  # CONFIRMED WORKING — this is the live service Jason's ArcGIS Pro session connects to
  # (DNRSvc/OC = LA Dept. of Natural Resources, Office of Conservation). Layer 0 = "Oil/Gas
  # Wells" (point layer: surface location only -- no BHL/line geometry in this service, unlike
  # TX daf420). Good enough for permit/status new-amended tracking; horizontal wellbore lines
  # aren't available from this endpoint.
  rest_url: "https://sonris-gis.dnr.la.gov/arcgis/rest/services/DNRSvc/OC/MapServer/0/query"
  date_field: "PERMIT_DATE"
  ords_csv_url: ""
  watch_dir: ./data/la/inbox
  fields:
    id: "WELL_SERIAL_NUM"
    api: "API_NUM"
    operator: "ORG_OPER_NAME"
    well: "WELL_NAME"
    well_num: "WELL_NUM"
    parish: "PARISH_NAME"
    field: "FIELD_NAME"
    issue_date: "PERMIT_DATE"
    spud: "SPUD_DATE"
    status: "WELL_STATUS_CODE"
    status_desc: "LEGEND_DESC"
    depth: "MEASURED_DEPTH"
    township: "TOWNSHIP"
    range: "WELL_RANGE"
    section: "SECTN"
    dirwell: "DIRWELL"
    lat: "SURFACE_LAT_DEC_DEG"
    lon: "SURFACE_LONG_DEC_DEG"

# -------- corridors: county/parish -> client tag (drives the digest) --------
corridors:
  "DLS / EOG — Giddings & Eastern Eagle Ford":
    tx: [LEE, FAYETTE, BASTROP, WASHINGTON, GONZALES, LAVACA, DEWITT, AUSTIN, COLORADO]
  "DOXA / Sabine — East Texas":
    tx: [RUSK, PANOLA, SHELBY, HARRISON, NACOGDOCHES, SMITH, GREGG, CHEROKEE]
  "DOXA / Firebird — Permian":
    tx: [ECTOR, WINKLER, UPTON, MIDLAND, CRANE, ANDREWS]
  "West Haynesville watch":
    tx: [LEON, ROBERTSON, FREESTONE, HOUSTON, MADISON, ANDERSON]
  "RROG + DOXA — NW Louisiana Haynesville":
    la: [CADDO, DESOTO, "RED RIVER", BOSSIER, BIENVILLE, SABINE, WEBSTER, NATCHITOCHES]

# -------- operator families (corporate-intel layer) --------
operator_families:
  ADAMAS:        {family: "Adamas (ex-Aethon, Mitsubishi)", aliases: [ADAMAS, AETHON]}
  APEX:          {family: "Apex (ex-Paloma, Citadel)",      aliases: [APEX, PALOMA]}
  EXPAND:        {family: "Expand (CHK+SWN, ex-Indigo)",    aliases: [EXPAND, CHESAPEAKE, SOUTHWESTERN, INDIGO]}
  COMSTOCK:      {family: "Comstock (Jerry Jones)",          aliases: [COMSTOCK]}
  EOG:           {family: "EOG Resources",                   aliases: [EOG]}
  SABINE:        {family: "Sabine Energy",                   aliases: [SABINE]}
  FIREBIRD:      {family: "Firebird Energy",                 aliases: [FIREBIRD]}
  DIVERSIFIED:   {family: "Diversified (legacy CV, Oaktree)",aliases: [DIVERSIFIED]}
  MARATHON:      {family: "Marathon (eastern EF push)",      aliases: [MARATHON]}
  MAGNOLIA:      {family: "Magnolia (EOG-contiguous, Lee Co)",aliases: [MAGNOLIA]}
  IRONBLOOM:     {family: "Ironbloom (new Giddings entrant)",aliases: [IRONBLOOM]}
  SAGE:          {family: "Sage Natural Resources (incl. Brushfire Minerals)", aliases: [SAGE, BRUSHFIRE]}
